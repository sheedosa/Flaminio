<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم فلامينيو</title>
<meta name="theme-color" content="#802a19">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="../img/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لوحة فلامينيو">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=Tajawal:wght@400;500;700&family=Lustria&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="config.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="../" data-i18n-title="siteLink">
    <picture><source type="image/webp" srcset="../img/logo-burgundy.webp"><img src="../img/logo-burgundy.png" alt="فلامينيو" width="640" height="544"></picture>
  </a>
  <div class="top-title">
    <div class="top-name" data-i18n="dashboard">لوحة التحكم</div>
    <div class="top-branch" id="top-branch"></div>
  </div>
  <button type="button" class="lang-btn" id="lang-btn">English</button>
  <div class="top-actions" id="top-actions"></div>
</header>

<main id="app" class="app" aria-live="polite">
  <p class="loading" data-i18n="loading">جارٍ التحميل…</p>
</main>

<footer class="savebar" id="savebar" hidden>
  <div class="savebar-status" id="save-status" data-i18n="none">لا توجد تغييرات</div>
  <div class="savebar-actions">
    <button type="button" class="btn btn-ghost" id="discard-btn" data-i18n="discard" hidden>تراجع عن التغييرات</button>
    <button type="button" class="btn btn-primary" id="save-btn" data-i18n="save" disabled>حفظ ونشر</button>
  </div>
</footer>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file-input" accept="image/*" hidden>

<script type="module" src="admin.js"></script>
</body>
</html>
