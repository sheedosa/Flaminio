name: Admin end-to-end test
on:
  push:
    branches: [admin-e2e]
permissions:
  contents: write
  actions: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TARGET: admin-e2e-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scripts/build.mjs
      - name: Create the throwaway target branch from main
        run: |
          SHA=$(curl -s -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/$REPO/git/ref/heads/main | jq -r .object.sha)
          curl -s -X DELETE -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/$REPO/git/refs/heads/$TARGET || true
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" https://api.github.com/repos/$REPO/git/refs -d "{\"ref\":\"refs/heads/$TARGET\",\"sha\":\"$SHA\"}" > /dev/null
      - run: (python3 -m http.server 8931 -d dist > /dev/null 2>&1 &) && sleep 2 && node tests/admin-e2e.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e-shots
      - if: always()
        name: Delete the throwaway target branch
        run: curl -s -X DELETE -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/$REPO/git/refs/heads/$TARGET || true
