<!-- @head -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{{hreflang}}}
<meta name="theme-color" content="#802a19">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{t.siteName}}">
<meta property="og:locale" content="{{t.locale}}">
<meta property="og:locale:alternate" content="{{altLocale}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:secure_url" content="{{ogImage}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{t.ogAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogTitle}}">
<meta name="twitter:description" content="{{ogDescription}}">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="twitter:image:alt" content="{{t.ogAlt}}">
<link rel="icon" href="{{base}}favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{base}}img/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{base}}img/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{base}}img/icons/apple-touch-icon.png">
<link rel="manifest" href="{{base}}site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{{preload}}}
<link href="{{fontsHref}}" rel="stylesheet">
<link rel="stylesheet" href="{{base}}css/style.css">
<script>document.documentElement.classList.add('js')</script>
<script type="application/ld+json">{{{jsonLd}}}</script>
<!-- @header -->
<a href="#main" class="skip-link">{{t.skip}}</a>
<header class="site-header">
  <div class="header-top">
    <div class="header-icons">
      <a href="tel:{{contact.phoneTel}}" aria-label="{{t.callUs}}" class="icon-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#802a19" stroke-width="1.4" aria-hidden="true"><rect x="4.5" y="1.5" width="7" height="13" rx="2"></rect><circle cx="8" cy="12" r=".8" fill="#802a19"></circle></svg>
      </a>
      <a href="{{iconMenuHref}}" aria-label="{{iconMenuLabel}}" class="icon-btn icon-btn--secondary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#802a19" stroke-width="1.4" aria-hidden="true"><line x1="2" y1="4" x2="14" y2="4"></line><line x1="2" y1="8" x2="14" y2="8"></line><line x1="2" y1="12" x2="14" y2="12"></line></svg>
      </a>
      <a href="{{homeHref}}#contact" aria-label="{{t.locationIcon}}" class="icon-btn icon-btn--secondary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#802a19" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="6.5" r="4.5"></circle><circle cx="8" cy="6.5" r="1.5"></circle><line x1="8" y1="11" x2="8" y2="15"></line></svg>
      </a>
    </div>
    <a href="{{logoHref}}" class="header-logo" aria-label="{{logoLabel}}">
      <picture>
        <source type="image/webp" srcset="{{base}}img/logo-burgundy.webp">
        <img src="{{base}}img/logo-burgundy.png" alt="{{t.logoAlt}}" width="640" height="544" fetchpriority="high">
      </picture>
    </a>
    <div class="header-right">
      <a href="{{switchHref}}" class="lang-btn" lang="{{t.switchLang}}" hreflang="{{t.switchLang}}" title="{{t.switchTitle}}" data-lang-switch>{{t.switchLabel}}</a>
      <a href="tel:{{contact.phoneTel}}" class="reserve-btn"><span class="reserve-long">{{t.reserveLong}}</span><span class="reserve-short">{{t.reserveShort}}</span></a>
    </div>
  </div>
  <nav class="site-nav" aria-label="{{t.navPrimary}}">{{{nav}}}</nav>
</header>
<!-- @footer -->
<footer class="site-footer">
  <picture><source type="image/webp" srcset="{{base}}img/logo-cream.webp"><img src="{{base}}img/logo-cream.png" alt="{{t.logoAlt}}" class="footer-logo" width="640" height="544" loading="lazy" decoding="async"></picture>
  <nav class="footer-nav" aria-label="{{t.navFooter}}">{{{nav}}}</nav>
  <div class="footer-rule"></div>
  <div class="footer-contact"><a href="tel:{{contact.phoneTel}}"><bdi dir="ltr">{{contact.phoneDisplay}}</bdi></a><br>{{t.address}}</div>
  <div class="footer-social">
    <a href="{{contact.facebook}}" target="_blank" rel="noopener" aria-label="{{t.facebook}}" class="social-btn">f</a>
  </div>
  <div class="footer-copy">{{t.copyright}}</div>
</footer>
