<!DOCTYPE html>
<html lang="{{lang}}" dir="{{t.dir}}" data-branch="{{branch.id}}" data-branch-name="{{branchName}}" data-whatsapp="{{contact.whatsapp}}">
<head>
{{> head}}
</head>
<body>
{{> header}}

<main id="main">
<section class="menu-hero" aria-labelledby="menu-title">
  <div class="menu-intro">
    {{{divider}}}
    <h1 class="serif menu-title" id="menu-title">{{t.menuHeading}}</h1>
    <p class="menu-subtitle">{{t.menuIntro}}</p>
    {{{menuBranch}}}
    {{{chefLine}}}
    {{{pdfButton}}}
  </div>

  <nav class="menu-tabs" id="menu-tabs" aria-label="{{t.tabsLabel}}">{{{menuTabs}}}</nav>

  <div class="menu-panels">{{{menuPanels}}}</div>
  <p class="menu-note">{{t.priceNote}}</p>
</section>
</main>

{{> footer}}

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="{{t.photoViewer}}">
  <figure class="lightbox-figure">
    <img id="lightbox-img" src="data:," alt="">
    <figcaption id="lightbox-cap"></figcaption>
  </figure>
  <button type="button" class="lightbox-close" aria-label="{{t.closeViewer}}" id="lightbox-close">×</button>
</div>

<script type="module" src="{{base}}js/menu.js"></script>
</body>
</html>
